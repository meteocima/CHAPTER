# CHAPTER Pipeline Configuration
# Override any value from CLI: python hpc/submit_pipeline.py dates.start=2023-03-01

# Preview mode for the step-by-step pipeline: print fetch/convert/recursion
# commands locally without submitting to SLURM or touching the network.
dry_run: false
# Read-only consolidated status report (no SLURM submission) for submit_step_pipeline.py.
report: false

# Date range to process (day-based pipeline: submit_pipeline.py)
dates:
  start: "2023-02-01"
  end: "2023-02-28"

# Time window for the step-by-step pipeline (submit_step_pipeline.py).
# Hourly timesteps from start_date/start_hour (OLDEST) to end_date/end_hour (NEWEST), inclusive.
# With direction=backward the run starts at the NEWEST end and walks back to the oldest.
window:
  start_date: "2025-06-30"
  start_hour: 14
  end_date: "2025-06-30"
  end_hour: 23

# Step-by-step pipeline behaviour
pipeline:
  direction: backward  # backward = newest->oldest (default); forward = oldest->newest
  # The fetch driver runs on a LOGIN NODE (the datamover is NOT reachable from
  # lrd_all_serial / compute nodes). The login-node cap is 600s of CPU time per
  # process, which the driver never approaches (the datamover does the transfer),
  # so the driver works to this wall-time budget then re-spawns itself (detached)
  # for the next batch. Keep driver_max_seconds + datamover.fetch_timeout < ~1800.
  driver_max_seconds: 1080  # ~18 min per driver process before it re-spawns
  # Fetch the wrfout files and STOP there: no convert job is submitted, so the
  # downloaded wrfout is KEPT (convert_step.sh deletes it on success). Used to
  # stage raw files for someone else; pair it with a dedicated paths.wrfout_dir.
  download_only: false
  # Convert but KEEP the input wrfout (convert_step.sh skips its rm). Used to convert
  # staged files that must stay on disk. The 00Z sidecar invariant is unaffected.
  keep_wrfout: false

# Paths on Leonardo
paths:
  work_dir: /leonardo_work/AIFPT_AILAMIT/CHAPTER
  wrfout_dir: ${paths.work_dir}/wrfout
  # GRIB2 schema (183 messages). Deliberately a different tree from the old
  # GRIB1 `grib/`: convert_step.sh keys its re-entrancy on the output file
  # existing, so writing the new schema into the old tree would silently skip
  # every hour already converted. `grib/` is dropped once `grib_v2` is validated.
  grib_dir: ${paths.work_dir}/grib_v2
  # 00Z reference sidecars for accumulated fields (tp is referred to 00Z of the same day;
  # see accum_ref.py). Shared by every chain: the 00Z wrfout is never deleted without it.
  accum_ref_dir: ${paths.work_dir}/accum_ref
  log_dir: ${paths.work_dir}/logs
  status_log: ${paths.log_dir}/step_pipeline_status.log  # append-only step ledger (driver-written)
  # Per-chain files: override all three (with status_log) when running a second
  # driver chain, or a stop request / ledger of one chain would hit the other.
  driver_log: ${paths.log_dir}/fetch_step_driver.log  # driver narrative (stdout of the chain)
  stop_flag: ${paths.log_dir}/fetch_step.stop        # touch it to stop the chain cross-node
  project_dir: .  # path to CHAPTER repo on Leonardo
  # Optional skip-list: timesteps to skip a-priori (e.g. sources known to be on tape/OFFLINE,
  # not yet recalled). Accepts either absolute wrfout paths (the mmlsattr stagelist) or bare
  # YYYY-MM-DDTHH lines; '#'/blank ignored. Empty = skip nothing. Driver logs SKIP_OFFLINE.
  skip_list: ""

# SuperMUC remote configuration (day-based pipeline: rsync via SSH ControlMaster)
supermuc:
  host: supermuc
  base_2023: /dss/dsafs01/0001/pn29co-dss-0000/CHAPTER-23-25
  base_pre2023: /dss/dsafs01/0001/pn29co-dss-0000/CHAPTER
  init_hour: 18

# Datamover-based fetch (step-by-step pipeline). Run from a LOGIN NODE: the driver
# triggers an sftp on the CINECA datamover, which reaches the LRZ data relay.
# NB: data.leonardo.cineca.it is reachable from regular login nodes only, NOT from
# lrd_all_serial (login08/13 are firewalled off). These are the relay-view paths,
# different from supermuc.* (DSS view).
datamover:
  host: data.leonardo.cineca.it                # the CINECA datamover hop (we ssh into it)
  remote_host: datarelay@rdmtests.srv.lrz.de   # LRZ data relay, addressed as user@host
  identity_file: /leonardo/home/userexternal/lmonaco0/.ssh/id_rsa  # key used by sftp ON the datamover
  sftp_opts: "-B 262144 -R 256 -p"             # 256K buffer, 256 outstanding requests, preserve times
  base_2023: /home/datarelay/mnt/CHAPTER-23-25
  base_pre2023: /home/datarelay/mnt/CHAPTER  # verified 2026-09-07: 2019 init folders exist here
  init_hour: 18
  fetch_timeout: 600  # s: sftp wrapped in `timeout`; cuts tape-recall hangs well within the login limit
  fetch_retries: 2    # retry transient sftp failures before logging the timestep as failed

# Batch / parallelism for the step-by-step pipeline
batch:
  size: 24           # upper bound on timesteps per driver process (time budget usually cuts first)
  fetch_parallel: 2  # concurrent scp through the datamover (keep low: shared login node + datamover)
  # Queue gate (0 = off). >0: each batch starts only when the user has no conv_* job
  # queued, and batch.size is capped to it. E.g. size=48 + 48 = two days at a time.
  max_queued_converts: 0

# SLURM settings
slurm:
  account: ""  # project account, leave empty if not needed (REQUIRED for dcgp_usr_prod)
  fetch_partition: lrd_all_serial
  fetch_walltime: "02:00:00"
  convert_partition: lrd_all_serial
  convert_walltime: "01:00:00"
  convert_mem: "20G"
  orchestrator_walltime: "04:00:00"
  # step-by-step pipeline (submit_step_pipeline.py)
  # NB: the fetch driver runs on a login node (NOT SLURM) -- see pipeline.driver_max_seconds.
  # convert runs on dcgp_usr_prod -> needs the DCGP-budget association
  step_convert_partition: dcgp_usr_prod
  step_convert_walltime: "01:00:00"
  step_convert_mem: "32G"   # measured peak RSS 18.2 GB for the 183-message schema; RAM is not billed on DCGP
  step_convert_account: aifpt_ailamit_0  # project AILAMIT, DCGP association

# GRIB output naming (Anemoi convention)
grib:
  name_template: "ailam-an-cima-3km-{year}-{year}-1h-v1-{date_compact}{hour:02d}.grib"
